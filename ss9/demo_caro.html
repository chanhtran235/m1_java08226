<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<p id='board'></p>
<script>
    let isX= true;
    let array = new Array(10);
    for (let i = 0; i < array.length; i++) {
        array[i] = new Array(10);
        for (let j = 0; j < array[i].length; j++) {
            array[i][j] = "";
        }
    }
    // biến toàn cục(global) => có thể truy câp đuọc moi ôi
    let i = 10;
    display();

    function display() {
        let tableString = `<table border="1" style="border-collapse: collapse">`;
        for (let i = 0; i < array.length; i++) {
            tableString += ` <tr>`;
            for (let j = 0; j < array[i].length; j++) {
                // gọi ha hoặc sử dụng hàm
                tableString += `<td onclick="play(${i},${j})" style="width: 30px ;height: 30px;text-align: center">${array[i][j]}</td>`;
            }
            tableString += ` </tr>`;
        }
        tableString += `</table>`;
        document.getElementById("board").innerHTML = tableString;
    }

    function play(x, y) {
        if (array[x][y] ===""){
            if(isX){
                array[x][y] = "X";
                isX =false;
                if (checkWin()){
                    alert("X người chiến thắng")
                }
            }else{
                array[x][y] = "O";
                isX =true;
                if (checkWin()){
                    alert("O người chiến thắng")
                }
            }

            display();
        }else {
            alert("Ô này đã đánh rồi bạn ơi!!!!!!!!!!")
        }
    }

    // viết hàm kiểm tra chiêns thắng.

    function checkWin(){
        for (let i = 0; i < array.length; i++) {
            for (let j = 0; j < array[i].length; j++) {
               if ( array[i][j] === "X"){
                   if ( array[i][j+1] === "X" && array[i][j+2] === "X"){
                       return true;
                   }
                   if ( array[i+1][j] === "X" && array[i+2][j] === "X"){
                       return true;
                   }
                   if ( array[i+1][j+1] === "X" && array[i+2][j+2] === "X"){
                       return true;
                   }
                   if ( array[i+1][j-1] === "X" && array[i+2][j-2] === "X"){
                       return true;
                   }
               }
                if ( array[i][j] === "O"){
                    if ( array[i][j+1] === "O" && array[i][j+2] === "O"){
                        return true;
                    }
                    if ( array[i+1][j] === "O" && array[i+2][j] === "O"){
                        return true;
                    }
                    if ( array[i+1][j+1] === "O" && array[i+2][j+2] === "O"){
                        return true;
                    }
                    if ( array[i+1][j-1] === "O" && array[i+2][j-2] === "O"){
                        return true;
                    }
                }
            }
        }
    }

</script>
</body>
</html>
