<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    for (let i = 1; i <=10 ; i++) {
        for (let j = 1; j<=i  ; j++) {
            document.write("*");
        }
        document.write("<br>")
    }

    document.writeln("<hr>")

    for (let i = 1; i <=10 ; i++) {
        for (let j = 0; j<=10-i  ; j++) {
            document.write("*");
        }
        document.write("<br>")
    }

    document.writeln("<hr>")

    for (let i = 1; i <=10 ; i++) {
        for (let j = 0; j<=10-i  ; j++) {
            document.write("&ensp;");
        }
        for (let j = 1; j<=i  ; j++) {
            document.write("*");
        }
        document.write("<br>")
    }

    document.writeln("<hr>")

    for (let i = 0; i <=10 ; i++) {
        for (let j = 0; j<=10; j++) {
            if (j<=10-i){
                document.write("&ensp;");
            }else {
                document.write("*");
            }
        }
        document.write("<br>")
    }


    document.writeln("<hr>")

    for (let i = 0; i <=10 ; i++) {
        for (let j = 0; j<=10  ; j++) {
            if(i==0||j==0||i==10||j==10){
                document.write("*");
            }else {
                document.write("&ensp;");
            }
        }
        document.write("<br>")
    }

</script>
</body>
</html>
