<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<!-- Bootstrap 5.2 -->
<link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <form action="#" method="get"
                  class="card border-0 shadow-lg overflow-hidden">

                <!-- Header -->
                <div class="card-header text-white text-center py-3"
                     style="background: linear-gradient(135deg, #6f2cff, #7b2ff7);">

                    <h2 class="mb-0 fs-4 fw-bold">
                        ĐĂNG KÝ HỌC VIÊN
                    </h2>

                </div>

                <!-- Body -->
                <div class="card-body p-4">

                    <!-- Họ và tên -->
                    <div class="row align-items-center mb-3">

                        <label for="name2"
                               class="col-sm-4 col-form-label fw-semibold">
                            Họ và tên
                        </label>

                        <div class="col-sm-8">
                            <input type="text"
                                   id="name2"
                                   name="name2"
                                   class="form-control">
                        </div>

                    </div>


                    <!-- Ngày sinh -->
                    <div class="row align-items-center mb-3">

                        <label for="ngaysinh"
                               class="col-sm-4 col-form-label fw-semibold">
                            Ngày sinh
                        </label>

                        <div class="col-sm-8">
                            <input type="text"
                                   id="ngaysinh"
                                   name="ngaysinh"
                                   class="form-control">
                        </div>

                    </div>


                    <!-- Giới tính -->
                    <div class="row align-items-center mb-3">

                        <label class="col-sm-4 col-form-label fw-semibold">
                            Giới tính
                        </label>

                        <div class="col-sm-8">

                            <div class="form-check form-check-inline">
                                <input class="form-check-input"
                                       type="radio"
                                       name="gioitinh"
                                       id="male"
                                       value="male">

                                <label class="form-check-label"
                                       for="male">
                                    Nam
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input"
                                       type="radio"
                                       name="gioitinh"
                                       id="female"
                                       value="female">

                                <label class="form-check-label"
                                       for="female">
                                    Nữ
                                </label>
                            </div>

                        </div>

                    </div>


                    <!-- Địa chỉ -->
                    <div class="row mb-3">

                        <label for="diachi"
                               class="col-sm-4 col-form-label fw-semibold">
                            Địa chỉ
                        </label>

                        <div class="col-sm-8">

                            <textarea id="diachi"
                                      name="diachi"
                                      class="form-control"
                                      rows="2"></textarea>

                        </div>

                    </div>


                    <!-- Lớp -->
                    <div class="row align-items-center mb-3">

                        <label class="col-sm-4 col-form-label fw-semibold">
                            Lớp
                        </label>

                        <div class="col-sm-8">

                            <select class="form-select"
                                    name="lop">

                                <option value=" ">
                                    ---Chọn lớp---
                                </option>

                                <option value="A13">
                                    A13
                                </option>

                                <option value="A14">
                                    A14
                                </option>

                                <option value="A15">
                                    A15
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- Email -->
                    <div class="row align-items-center mb-3">

                        <label for="email"
                               class="col-sm-4 col-form-label fw-semibold">
                            Email
                        </label>

                        <div class="col-sm-8">

                            <input type="text"
                                   id="email"
                                   name="email"
                                   class="form-control">

                        </div>

                    </div>


                    <!-- Điện thoại -->
                    <div class="row align-items-center mb-4">

                        <label for="phone"
                               class="col-sm-4 col-form-label fw-semibold">
                            Điện thoại
                        </label>

                        <div class="col-sm-8">

                            <input type="number"
                                   id="phone"
                                   name="phone"
                                   class="form-control">

                        </div>

                    </div>


                    <!-- Buttons -->
                    <div class="text-center">

                        <button type="submit"
                                class="btn text-white px-4 me-2"
                                style="background-color:#6f2cff;">
                            Đăng Ký
                        </button>

                        <button type="reset"
                                class="btn btn-outline-secondary px-4">
                            Nhập lại
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>
</body>
</html>
